name: jnet checks

on:
  push:
    branches: [jnet]
  pull_request:
    branches: [jnet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Upstream has timing-sensitive tests; each failing test gets one rerun, a repeat failure still fails.
      - run: python3 .github/scripts/go-test-rerun.py
      - run: go build -o test-output ./cmd/server
